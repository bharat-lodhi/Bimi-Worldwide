{% extends 'custom_admin/dashboard.html' %}

{% block content %}

<div class="container mt-5" style="max-width:700px;">

    <div class="card shadow border-0">
        <div class="card-body">

            <h3 class="mb-4">Add Category</h3>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text"
                           name="name"
                           class="form-control">
                </div>


<div class="mb-3">
    <label>Short Description</label>

    <textarea name="short_description"
              id="editor"
              class="form-control"></textarea>
</div>

<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

<script>
ClassicEditor
    .create(document.querySelector('#editor'), {

        toolbar: [
            
            'heading',
            '|',
            'bold',
            'italic',
            'link',
            'bulletedList',
            'numberedList',
            '|',
            'insertTable',
            'blockQuote',
            'undo',
            'redo',
            '|',
            'htmlEmbed'
        ]

    })
    .then(editor => {

        editor.ui.view.editable.element.style.minHeight = '150px';

    })
    .catch(error => {
        console.error(error);
    });
</script>

<style>
.ck-editor__editable_inline {
    min-height: 150px !important;
}
</style>

                <div class="mb-3">
                    <label>Image</label>
                    <input type="file"
                           name="image"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label>Category Video (Optional)</label>
                    <input type="file"
                           name="category_video"
                           id="videoInput"
                           accept="video/mp4,video/webm,video/ogg"
                           class="form-control">
                    <small class="text-muted">Only .mp4, .webm, and .ogg files up to 100MB are allowed.</small>
                    <div id="videoPreviewContainer" class="mt-2 d-none">
                        <video id="videoPreview" controls class="img-fluid rounded" style="max-height: 200px; width: 100%; object-fit: cover;"></video>
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-dark w-100">
                    Add Category
                </button>

                <script>
                document.getElementById('videoInput').addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    const previewContainer = document.getElementById('videoPreviewContainer');
                    const previewVideo = document.getElementById('videoPreview');
                    
                    if (file) {
                        const fileURL = URL.createObjectURL(file);
                        previewVideo.src = fileURL;
                        previewContainer.classList.remove('d-none');
                    } else {
                        previewVideo.src = '';
                        previewContainer.classList.add('d-none');
                    }
                });
                </script>

            </form>

        </div>
    </div>

</div>

{% endblock %}
